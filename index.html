<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>基金时光机 V4</title>
<style>
body{font-family:Microsoft YaHei;background:#f5f7fb;padding:30px;color:#172033}
.card{background:white;border-radius:18px;padding:24px;margin:16px auto;max-width:900px;box-shadow:0 8px 25px #ddd}
button{padding:10px 16px;border:0;border-radius:10px;background:#5965e8;color:white;cursor:pointer}
input,textarea{width:90%;padding:10px;margin:8px;border:1px solid #ddd;border-radius:8px}
.tip{background:#eef1ff;padding:15px;border-radius:12px}
</style>
</head>
<body>
<div class="card">
<h1>基金时光机 V4</h1>
<p>在不损失真钱的情况下，训练你的投资决策能力。</p>
<button onclick="alert('进入新手模式')">基金新手</button>
<button onclick="alert('进入亏损复盘模式')">经常亏损</button>
<button onclick="alert('进入策略测试')">测试策略</button>
</div>

<div class="card">
<h2>投资学院</h2>
<h3>什么是仓位？</h3>
<div class="tip">假设你有10000元，投入4000元买基金。仓位就是40%。</div>
<h3>什么是最大回撤？</h3>
<div class="tip">资产从最高点下降到最低点的最大跌幅。</div>
</div>

<div class="card">
<h2>自定义投资规则</h2>
<input placeholder="初始资金：100000元">
<input placeholder="单只基金最大仓位：40%">
<input placeholder="最大接受回撤：15%">
<textarea placeholder="我的投资规则"></textarea>
<button onclick="alert('规则保存成功')">保存规则</button>
</div>

<div class="card">
<h2>AI投资教练</h2>
<textarea placeholder="请输入你的问题"></textarea>
<button onclick="alert('AI分析：先检查交易纪律和情绪影响')">询问AI</button>
</div>

<div class="card">
<h2>投资人格报告</h2>
<p>分析交易习惯、情绪化交易比例、风险偏好和改进建议。</p>
</div>

<div class="card">
<h2>策略实验室</h2>
<p>比较定投、下跌加仓、长期持有等策略。</p>
<button onclick="alert('开始策略模拟')">开始测试</button>
</div>
</body>
</html>
